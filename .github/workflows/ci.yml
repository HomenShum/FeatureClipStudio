name: CI

# What this proves: the syntax gate passes and the Remotion render pipeline
# reproduces from the committed walkthrough data (src/walkthrough.data.js +
# public/wt/) alone. What it deliberately excludes: the Playwright capture
# step (walkthrough.mjs), which needs live localhost apps and cannot run here.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-smoke-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      # Asserts the MAX_PATH explanation is still wired to every command that
      # starts Remotion (defect D1). The 260-character boundary itself is a
      # Windows fact and is skipped here; the wiring is not.
      - run: npm run probe:maxpath
      - name: Ensure Remotion headless browser
        run: npx remotion browser ensure
      # Through run-remotion.mjs, like every other Remotion command here — which
      # also keeps CI proving the wrapper is transparent on a platform where the
      # defect it guards cannot happen.
      - name: Smoke render (frames 0-30 of a bundled walkthrough)
        run: node run-remotion.mjs render src/index.js WT-NodeRoom /tmp/wt-smoke.mp4 --frames=0-30 --concurrency=2
      - name: Verify artifact exists and is non-trivial
        run: test -s /tmp/wt-smoke.mp4 && stat -c '%s bytes' /tmp/wt-smoke.mp4
